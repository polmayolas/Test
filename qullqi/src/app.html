<main class="app" id="app">
  <!-- INICIO -->
  <section class="screen" id="scr-home" aria-labelledby="h-home">
    <header class="lt">
      <div>
        <p class="eyebrow" id="today-label"></p>
        <div class="brand"><span data-logo></span><h1 id="h-home">Qullqi</h1></div>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes"></button>
    </header>
    <div id="banners"></div>

    <div class="cash" id="cash-card">
      <p class="label"><span data-icon="atm"></span>Efectivo en mano</p>
      <p class="big" id="cash-total"><span class="cur">Bs</span>0</p>
      <div id="start-box"></div>
      <div class="cash-stats" id="cash-stats">
        <div><span>Gastado hoy</span><strong id="spent-today">Bs 0</strong></div>
        <div><span id="month-label">Este mes</span><strong id="spent-month">Bs 0</strong></div>
      </div>
    </div>

    <div id="whoami"></div>

    <div class="composer" id="composer">
      <button class="mic" id="mic" type="button" aria-label="Dictar un gasto"></button>
      <p class="mic-label" id="mic-label">Toca y di tu gasto</p>
      <p class="mic-sub" id="mic-sub">Por ejemplo: «25 bolivianos en un café para Noah»</p>
      <p class="live" id="live" aria-live="polite"></p>
      <form class="typebar" id="typebar" autocomplete="off">
        <label class="sr" for="say">Escribe o dicta un gasto</label>
        <input id="say" name="say" type="text" enterkeyhint="send" placeholder="Escribe: 40 taxi, 120 súper…" />
        <button class="send" id="send" type="submit" aria-label="Interpretar" disabled></button>
      </form>
      <p class="examples" id="examples"></p>
    </div>

    <div class="quick">
      <button type="button" id="add-expense"><span data-icon="plus"></span>Añadir gasto</button>
      <button type="button" id="add-cash"><span data-icon="atm"></span>Sumar efectivo</button>
    </div>

    <section class="sec" aria-labelledby="h-recent">
      <div class="sec-h"><h2 id="h-recent">Recientes</h2><button class="link" id="see-all" type="button">Ver todo</button></div>
      <div class="group"><ul class="list" id="recent"></ul></div>
    </section>
  </section>

  <!-- MOVIMIENTOS -->
  <section class="screen" id="scr-hist" aria-labelledby="h-hist" hidden>
    <header class="lt"><div><p class="eyebrow">Historial</p><h1 id="h-hist">Movimientos</h1></div></header>
    <div class="seg" role="group" aria-label="Filtrar" id="hist-seg">
      <button type="button" data-f="all" aria-pressed="true">Todo</button>
      <button type="button" data-f="expense" aria-pressed="false">Gastos</button>
      <button type="button" data-f="cash" aria-pressed="false">Entradas</button>
    </div>
    <div class="search"><span data-icon="search"></span><label class="sr" for="q">Buscar</label><input id="q" type="search" placeholder="Buscar" autocomplete="off" /></div>
    <div id="hist-chip"></div>
    <div id="hist-list"></div>
  </section>

  <!-- RESUMEN -->
  <section class="screen" id="scr-sum" aria-labelledby="h-sum" hidden>
    <header class="lt"><div><p class="eyebrow">Análisis</p><h1 id="h-sum">Resumen</h1></div></header>
    <div class="monthnav">
      <button type="button" id="m-prev" aria-label="Mes anterior"></button>
      <h2 id="m-label"></h2>
      <button type="button" id="m-next" aria-label="Mes siguiente"></button>
    </div>
    <div id="sum-body"></div>
  </section>
</main>

<div class="tabbar">
  <nav aria-label="Secciones">
    <button type="button" data-tab="home" aria-current="page"><span data-icon="home"></span>Inicio</button>
    <button type="button" data-tab="hist"><span data-icon="list"></span>Movimientos</button>
    <button type="button" data-tab="sum"><span data-icon="chart"></span>Resumen</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-h">
    <button type="button" class="l" id="sheet-cancel">Cancelar</button>
    <h2 id="sheet-title"></h2>
    <button type="button" class="r" id="sheet-ok">Guardar</button>
  </div>
  <div class="sheet-b" id="sheet-body" tabindex="-1"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-act" hidden></button></div>
