<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Qullqi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Control de gastos en efectivo por voz">
<meta name="theme-color" content="#f2f2f7">
<style>
/* Qullqi — «plata, dinero» en quechua y aimara.
   Layout: una columna tipo iOS (máx. 560px), título grande, listas agrupadas, barra de pestañas inferior translúcida.
   Marca: fucsia de aguayo + franja tejida; verde reservado para el dinero que entra. */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --fill: #eeeef3;
  --fill-strong: #e3e3ea;
  --label: #0b0b0d;
  --label-2: #6b6b73;
  --label-3: #868690;
  --sep: rgba(60, 60, 67, 0.16);
  --accent: #b0145a;
  --accent-strong: #9c1050;
  --accent-ink: #ffffff;
  --accent-soft: rgba(176, 20, 90, 0.1);
  --accent-glow: rgba(176, 20, 90, 0.3);
  --pos: #157a55;
  --danger: #c4261b;
  --toast-act: #ff8fbd;
  --aguayo: linear-gradient(90deg, #b0145a 0 18%, #f2b705 18% 22%, #e8590c 22% 40%, #2f9e44 40% 44%, #1c7ed6 44% 62%, #f2b705 62% 66%, #6741d9 66% 84%, #2f9e44 84% 88%, #b0145a 88%);
  --bar-bg: rgba(249, 249, 251, 0.86);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
  --sheet-bg: #f2f2f7;
  --scrim: rgba(0, 0, 0, 0.32);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-strong: #3a3a3c;
    --label: #f5f5f7; --label-2: #a1a1aa; --label-3: #85858e; --sep: rgba(84, 84, 88, 0.55);
    --accent: #ff6aa6; --accent-strong: #ff8fbd; --accent-ink: #2a0014; --accent-soft: rgba(255, 106, 166, 0.16); --accent-glow: rgba(255, 106, 166, 0.25);
    --pos: #34c38a; --toast-act: #b0145a;
    --danger: #ff6961; --bar-bg: rgba(22, 22, 24, 0.86); --shadow: none; --sheet-bg: #111113;
    --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-strong: #3a3a3c;
  --label: #f5f5f7; --label-2: #a1a1aa; --label-3: #85858e; --sep: rgba(84, 84, 88, 0.55);
  --accent: #ff6aa6; --accent-strong: #ff8fbd; --accent-ink: #2a0014; --accent-soft: rgba(255, 106, 166, 0.16); --accent-glow: rgba(255, 106, 166, 0.25);
  --pos: #34c38a; --toast-act: #b0145a;
  --danger: #ff6961; --bar-bg: rgba(22, 22, 24, 0.86); --shadow: none; --sheet-bg: #111113;
  --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--label); font-family: var(--font);
  font-size: 17px; line-height: 1.35; letter-spacing: -0.01em;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body.sheet-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* ---------- cabecera ---------- */
.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 18px 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 38px; height: 38px; flex: none; display: block; }
.lt h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.eyebrow { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: 0.04em; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); color: var(--accent); box-shadow: var(--shadow); flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- avisos ---------- */
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--card); color: var(--label-2); font-size: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.banner strong { color: var(--label); }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--accent); }

/* ---------- tarjeta de efectivo ---------- */
.cash {
  position: relative; overflow: hidden;
  background: var(--card); border-radius: var(--r-lg); padding: 24px 20px 16px; box-shadow: var(--shadow);
}
.cash::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--aguayo); }
.cash .label svg { color: var(--accent); }
.start { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
.start .amt-box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 12px; padding: 0 12px; }
.start .amt-box span { color: var(--label-2); font-weight: 600; }
.start input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 20px; font-weight: 600; padding: 10px 0; font-variant-numeric: tabular-nums; }
.start .amt-box:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.btn-primary { min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; }
.start-q { margin: 12px 0 0; font-size: 15px; font-weight: 600; }
.item:has(> .mini:only-child), .item:has(> .mini:first-child) { margin-bottom: 8px; }
.start-help { margin: 8px 0 0; font-size: 13px; color: var(--label-2); }
.cash .label { margin: 0; font-size: 15px; color: var(--label-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.cash .label svg { width: 18px; height: 18px; }
.big {
  margin: 4px 0 0; font-family: var(--font-round); font-size: 44px; line-height: 1.05; font-weight: 700;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.big .cur { font-size: 0.5em; font-weight: 600; color: var(--label-2); margin-right: 6px; letter-spacing: 0; }
.big.neg { color: var(--danger); }
.cash-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--sep); }
.cash-stats span { display: block; font-size: 13px; color: var(--label-2); }
.cash-stats strong { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- compositor de voz ---------- */
.composer {
  margin-top: 14px; background: var(--card); border-radius: var(--r-lg); padding: 20px 18px 14px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; text-align: center;
}
.mic {
  position: relative; width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; transition: transform .15s ease, background .2s ease;
  box-shadow: 0 6px 18px var(--accent-glow);
}
.mic:active { transform: scale(0.95); }
.mic svg { width: 36px; height: 36px; position: relative; z-index: 1; }
.mic::before {
  content: ""; position: absolute; inset: -8px; border-radius: 50%; background: var(--accent-soft); opacity: 0;
  transition: opacity .2s;
}
.mic.on { background: var(--danger); box-shadow: 0 6px 18px rgba(217, 45, 32, 0.3); color: #fff; }
.mic.on::before { opacity: 1; background: rgba(217, 45, 32, 0.16); animation: pulse 1.4s ease-in-out infinite; }
.mic.busy { opacity: .7; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
.mic-label { margin: 12px 0 0; font-size: 17px; font-weight: 600; }
.mic-sub { margin: 2px 0 0; font-size: 14px; color: var(--label-2); max-width: 34ch; }
.live {
  margin: 12px 0 0; min-height: 0; font-size: 17px; line-height: 1.4; color: var(--label); max-width: 100%;
  overflow-wrap: anywhere;
}
.live:empty { display: none; }
.live .partial { color: var(--label-3); }
.typebar {
  margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 8px; background: var(--fill);
  border-radius: 999px; padding: 2px 2px 2px 16px; min-height: 48px;
}
.typebar input {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; font-size: 16px; outline: none;
}
.typebar input::placeholder { color: var(--label-2); }
.search input::placeholder { color: var(--label-2); }
.nowrap { white-space: nowrap; }
h1:focus, h2:focus { outline: none; }
.typebar:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.send {
  width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; flex: none; transition: opacity .15s;
}
.send:disabled { opacity: .3; }
.send svg { width: 20px; height: 20px; }
.examples { margin: 12px 0 0; font-size: 13px; color: var(--label-2); line-height: 1.5; }
.examples q { quotes: "«" "»"; color: var(--label); }
.examples button { color: var(--accent); font-weight: 500; }

.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.quick button {
  min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 10px; border-radius: var(--r-md);
  background: var(--card); color: var(--accent); font-weight: 600; font-size: 16px; box-shadow: var(--shadow);
}
.quick svg { width: 20px; height: 20px; }

/* ---------- quién soy ---------- */
.whoami {
  margin-top: 12px; background: var(--card); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.whoami p { margin: 0; font-size: 15px; }
.whoami p span { display: block; font-size: 13px; color: var(--label-2); }
.whoami .pills { display: flex; gap: 8px; }
.pill-btn { min-height: 44px; padding: 8px 20px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; }

/* ---------- secciones y listas ---------- */
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 8px; gap: 12px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.sec-h .link { color: var(--accent); font-size: 16px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; margin: -12px -4px; }
.sec-h .meta { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.group { background: var(--card); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); }
.list { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; min-height: 60px;
  position: relative; background: var(--card);
}
button.row:active { background: var(--fill); }
.list > li + li .row::before {
  content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: 1px solid var(--sep);
}
.row .txt { flex: 1; min-width: 0; }
.row .t1, .row .t2 { display: block; }
.row .t1 { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t2 { font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .amt { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .amt.in { color: var(--pos); }
.row .amt.adj { color: var(--label-2); }
.tile {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none;
}
.tile svg { width: 20px; height: 20px; }
.tile.sm { width: 28px; height: 28px; border-radius: 8px; }
.tile.sm svg { width: 16px; height: 16px; }
.empty { padding: 28px 20px; text-align: center; color: var(--label-2); font-size: 15px; }
.empty strong { display: block; color: var(--label); font-size: 17px; margin-bottom: 4px; }
.day-h {
  display: flex; justify-content: space-between; padding: 18px 4px 6px; font-size: 13px; font-weight: 600;
  color: var(--label-2); letter-spacing: 0.03em; font-variant-numeric: tabular-nums;
}
.more { display: block; width: 100%; padding: 14px; margin-top: 12px; border-radius: var(--r-md); background: var(--card); color: var(--accent); font-weight: 600; box-shadow: var(--shadow); }

/* ---------- controles ---------- */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px;
}
.seg button {
  padding: 11px 6px; min-height: 44px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--label); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #636366; } }
.search {
  display: flex; align-items: center; gap: 8px; background: var(--fill-strong); border-radius: 10px; padding: 0 10px; margin-top: 10px;
}
.search svg { width: 17px; height: 17px; color: var(--label-2); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 0; font-size: 16px; outline: none; }
.chip-filter {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 10px 6px 14px; min-height: 44px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-strong); font-size: 14px; font-weight: 600;
}
.chip-filter svg { width: 16px; height: 16px; }

/* ---------- resumen ---------- */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.monthnav h2 { margin: 0; font-size: 19px; font-weight: 600; text-align: center; flex: 1; }
.monthnav button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--card); box-shadow: var(--shadow); }
.monthnav button:disabled { color: var(--label-3); }
.monthnav svg { width: 20px; height: 20px; }
.hero { background: var(--card); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); }
.hero .label { margin: 0; font-size: 15px; color: var(--label-2); font-weight: 500; }
.hero .sub { margin: 8px 0 0; font-size: 14px; color: var(--label-2); font-variant-numeric: tabular-nums; }
.bars { padding: 6px 0; }
.bar-row { display: block; width: 100%; text-align: left; padding: 10px 14px; position: relative; }
button.bar-row:active { background: var(--fill); }
.bars > li + li .bar-row::before { content: ""; position: absolute; top: 0; right: 0; left: 54px; border-top: 1px solid var(--sep); }
.bar-top { display: flex; align-items: center; gap: 12px; }
.bar-top .name { flex: 1; min-width: 0; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-top .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-top .pct { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; width: 3.2em; text-align: right; }
.track { margin: 8px 0 0 40px; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--accent); min-width: 3px; }
.chart-card { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 14px 12px 10px; position: relative; }
.chart-card svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-card .axis { fill: var(--label-2); font-size: 11px; font-family: var(--font); }
.chart-card .grid { stroke: var(--sep); stroke-width: 1; }
.chart-card .base { stroke: var(--label-3); stroke-width: 1; }
.chart-card .col { fill: var(--accent); }
.chart-card .col.today { fill: var(--accent); }
.chart-card .col.dim { opacity: .35; }
.chart-card .col.sel { fill: var(--accent-strong); }
.chart-card .hit:focus { outline: none; }
.chart-card .hit:focus-visible { fill: var(--accent-soft); }
.chart-card .hit { fill: transparent; cursor: pointer; }
.tip {
  position: absolute; pointer-events: none; background: var(--label); color: var(--card); font-size: 13px; font-weight: 600;
  padding: 5px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); font-variant-numeric: tabular-nums;
}
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0; }
.kv > div { padding: 12px 14px; font-size: 16px; position: relative; }
.kv > div:nth-child(even) { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv > div:nth-child(n+3)::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--sep); }
.kv > div:nth-child(odd):nth-child(n+3)::before { left: 14px; }
.kv > div:nth-child(even):nth-child(n+3)::before { right: 0; }
.kv .muted { color: var(--label-2); font-weight: 400; }

/* ---------- barra de pestañas ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--sep);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 48px; color: var(--label-2); font-size: 11px; font-weight: 600; }
.tabbar button svg { width: 26px; height: 26px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* ---------- hoja inferior ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .22s ease; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; background: var(--sheet-bg); border-radius: 14px 14px 0 0;
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  max-width: 600px; margin: 0 auto; box-shadow: 0 -8px 40px rgba(0,0,0,.18);
}
.sheet.show { transform: none; }
.sheet-h {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 6px 16px; flex: none;
  border-bottom: 1px solid var(--sep);
}
.sheet-h h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; }
.sheet-h .l.ghost { visibility: hidden; }
.sheet-b:focus { outline: none; }
.sheet-h .l { justify-self: start; color: var(--accent); font-size: 17px; min-height: 44px; padding: 0 4px; margin-left: -4px; }
.sheet-h .r { justify-self: end; color: var(--accent); font-size: 17px; font-weight: 600; min-height: 44px; padding: 0 4px; margin-right: -4px; }
.sheet-h .r:disabled { color: var(--label-3); }
.sheet-b {
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.quote {
  margin: 0 0 14px; padding: 10px 14px; border-radius: var(--r-md); background: var(--card); font-size: 15px; color: var(--label-2);
  display: flex; gap: 10px; align-items: flex-start;
}

<script>
/* Qullqi — intérprete de gastos dictados en español (sin IA, coste cero).
 * parseUtterance(text, ctx) -> { items: [...], text }
 * Cada item: { type:'expense'|'cash_in', amount, currency, amountBs, category,
 *   who, method, source, date, note, flags:{...} }
 */
(function (root) {
  'use strict';

  // ---------- normalización (misma longitud que el original) ----------
  function strip(s) {
    let out = '';
    for (const c of s) {
      let x = c.normalize('NFD').replace(/[̀-ͯ]/g, '');
      if (x.length !== c.length) x = x.length ? (x + '  ').slice(0, c.length) : ' '.repeat(c.length);
      out += x;
    }
    return out.toLowerCase();
  }

  // ---------- números ----------
  const UNITS = Object.assign(Object.create(null), {
    cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7,
    ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15,
    dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiun: 21,
    veintiuno: 21, veintiuna: 21, veintidos: 22, veintitres: 23, veinticuatro: 24,
    veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29,
    treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80,
    noventa: 90, cien: 100, ciento: 100, doscientos: 200, doscientas: 200, trescientos: 300,
    trescientas: 300, cuatrocientos: 400, cuatrocientas: 400, quinientos: 500, quinientas: 500,
    seiscientos: 600, seiscientas: 600, setecientos: 700, setecientas: 700, ochocientos: 800,
    ochocientas: 800, novecientos: 900, novecientas: 900
  });
  const isTens = v => v >= 20 && v <= 90 && v % 10 === 0;
  const isHundreds = v => v >= 100 && v < 1000 && v % 100 === 0;

  function digitValue(raw) {
    let s = raw.replace(/[.,]+$/, '');
    const hasDot = s.includes('.'), hasComma = s.includes(',');
    if (hasDot && hasComma) {
      const dec = s.lastIndexOf('.') > s.lastIndexOf(',') ? '.' : ',';
      const th = dec === '.' ? ',' : '.';
      s = s.split(th).join('').replace(dec, '.');
    } else if (hasDot || hasComma) {
      const sep = hasDot ? '.' : ',';
      const parts = s.split(sep);
      // "1.500" = mil quinientos; "0,500" = medio
      if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3 && !/^0+$/.test(parts[0]))) s = parts.join('');
      else s = parts.join('.');
    }
    const v = parseFloat(s);
    return isFinite(v) ? v : null;
  }

  // ---------- tokenizador ----------
  function tokenize(norm) {
    const re = /\d(?:[\d.,]*\d)?|[a-z]+|\$|€|[,;.!?¿¡:]/g;
    const toks = [];
    let m;
    while ((m = re.exec(norm))) {
      const t = m[0];
      const glued = /^(dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)mil$/.exec(t);
      if (glued) {
        toks.push({ t: glued[1], start: m.index, end: m.index + glued[1].length, kind: 'word' });
        toks.push({ t: 'mil', start: m.index + glued[1].length, end: m.index + t.length, kind: 'word' });
        continue;
      }
      toks.push({
        t, start: m.index, end: m.index + t.length,
        kind: /^\d/.test(t) ? 'num' : /^[a-z]/.test(t) ? 'word' : t === '$' || t === '€' ? 'sym' : 'punct'
      });
    }
    return toks;
  }

  const CUR = Object.assign(Object.create(null), {
    bs: 'BOB', bob: 'BOB', boliviano: 'BOB', bolivianos: 'BOB', peso: 'BOB', pesos: 'BOB',
    pesitos: 'BOB', bolis: 'BOB', 'bs.': 'BOB',
    usd: 'USD', dolar: 'USD', dolares: 'USD', dollar: 'USD', dollars: 'USD', verdes: 'USD',
    eur: 'EUR', euro: 'EUR', euros: 'EUR', '$': 'USD', '€': 'EUR'
  });
  const curOf = tok => tok && (tok.kind === 'word' || tok.kind === 'sym') ? CUR[tok.t] || null : null;

  const VERBS = new Set(('gaste gastado gastamos gastar gasto gastaste gastaron pague pagado pagamos pagar ' +
    'pagaste pagaron costo cuesta costaron cuestan salio salieron son fueron compre compramos ' +
    'saque sacamos sacado sacar retire retiramos retirado retirar cambie cambiamos cambiado ' +
    'recibi recibimos cobre cobramos ingrese ingresamos dieron dio total precio vale valio puesto pagado gastado comprado').split(' '));

  const AFTER_DEC = new Set(['y', 'en', 'para', 'de', 'del', 'por', 'el', 'la', 'al', 'a', 'con']);
  const QTY_OK = new Set(['y', 'e', 'en', 'para', 'de', 'del', 'por', 'con', 'el', 'la', 'al', 'a', 'que', 'mas', 'menos', 'hoy', 'ayer', 'o', 'centavos', 'mil', 'medio', 'media', 'tambien', 'ademas', 'luego', 'despues', 'no', 'perdon', 'digo', 'cada', 'ida', 'vuelta']);

  const UNIT_NOUNS = new Set('noche noches ano anos dia dias mes meses semana semanas persona personas hora horas minuto minutos kilo kilos kg litro litros unidad unidades paquete paquetes vez veces docena metro metros gramos gr grs libra libras arroba arrobas ml cc plato platos'.split(' '));
  const STOPW = new Set('y e en de del por un una unos unas el la los las a al que para lo le les me nos te se mi con o es ha mas menos tambien ademas luego despues no si ya hoy ayer anoche cada'.split(' '));
  const isContent = w => !STOPW.has(w) && !VERBS.has(w) && !(w in UNITS) && !CUR[w] && w !== 'mil' && w.length > 1;
  let KW_WORDS = null;
  function kwWords() {
    if (!KW_WORDS) { KW_WORDS = new Set(); CATS.forEach(c => Object.keys(c.kw).forEach(w => strip(c.kw[w]).split(/\s+/).forEach(x => x.length > 2 && KW_WORDS.add(x)))); }
    return KW_WORDS;
  }
  // Número (en cifras o palabras) que empieza en k: {value, end}
  function numberAt(toks, k, dropMask) {
    const t = toks[k]; if (!t || dropMask[k]) return null;
    if (t.kind === 'num') { const v = digitValue(t.t); return v === null ? null : { value: v, end: k + 1 }; }
    if (t.kind !== 'word' || !(t.t in UNITS)) return null;
    let cur = 0, last = null, i = k, afterY = false;
    while (i < toks.length && !dropMask[i]) {
      const w = toks[i].t;
      if (toks[i].kind === 'word' && w in UNITS) {
        const v = UNITS[w];
        if (last === null) cur += v;
        else if (isHundreds(last) && v < 100) cur += v;
        else if (isTens(last) && afterY && v >= 1 && v <= 9) cur += v;
        else break;
        last = v; afterY = false; i++;
      } else if (w === 'y' && last !== null && isTens(last) && toks[i + 1] && UNITS[toks[i + 1].t] >= 1 && UNITS[toks[i + 1].t] <= 9) { afterY = true; i++; }
      else break;
    }
    return i > k ? { value: cur, end: i } : null;
  }

  // Busca candidatos de importe. dropMask: índices de tokens que no pueden ser importe.
  function findAmounts(toks, dropMask) {
    const out = [];
    for (let i = 0; i < toks.length; i++) {
      if (dropMask[i]) continue;
      const tk = toks[i];
      let value = null, j = i, fromWords = false;
      if (tk.kind === 'num') {
        value = digitValue(tk.t); j = i + 1;
        if (toks[j] && toks[j].t === 'mil') {
          value *= 1000; j++;
          // "2 mil 500" / "2 mil quinientos"
          const rest = numberAt(toks, j, dropMask);
          if (rest && rest.value < 1000) { value += rest.value; j = rest.end; }
        }
      } else if (tk.kind === 'word' && (tk.t in UNITS || tk.t === 'mil')) {
        // un/una/uno sólo cuentan si van seguidos de "mil" o de moneda
        if ((tk.t === 'un' || tk.t === 'una' || tk.t === 'uno') &&
            !(toks[i + 1] && (toks[i + 1].t === 'mil' || curOf(toks[i + 1])))) continue;
        let total = 0, cur = 0, last = null, k = i, afterY = false;
        while (k < toks.length && !dropMask[k]) {
          const w = toks[k].t;
          if (toks[k].kind === 'word' && w in UNITS) {
            const v = UNITS[w];
            if (last === null) cur += v;

    if (m) { day = +m[1]; mon = +m[2] - 1; if (m[3]) year = m[3].length === 2 ? 2000 + +m[3] : +m[3]; }
    else if ((m = /(\d{1,2}) de ([a-z]+)$/.exec(s))) { day = +m[1]; mon = MONTHS.indexOf(m[2]); if (mon > 8) mon = m[2] === 'setiembre' ? 8 : mon - 1; }

      day = m[1] === 'primero' ? 1 : m[1] === 'treinta y uno' ? 31 : UNITS[m[1]];
      mon = MONTHS.indexOf(m[2]); if (mon > 8) mon = m[2] === 'setiembre' ? 8 : mon - 1;
      if (!day) return null;
    }
    else return null;
    if (!(day >= 1 && day <= 31) || !(mon >= 0 && mon <= 11)) return null;
    let y = year || today.getFullYear();
    let r = new Date(y, mon, day);
    if (r.getDate() !== day) return null;
    if (!year && r > today) {
      if (/^el dia/.test(s)) { r = new Date(y, mon - 1, day); if (r.getDate() !== day) return null; }
      else r = new Date(y - 1, mon, day);
    }
    if (r > today || today - r > 400 * 864e5) return null;
    return r;
  }

  // ---------- tipo ----------
  // Verbos de entrada que sólo cuentan si su objeto es dinero ("saqué 500", "saqué plata"),
  // no "sacamos entradas", "retiré el pedido", "recibí la factura", "nos dieron la cuenta".
  const NUMW = '(?:\\d|un |una |mil|cien|ciento|doscient|trescient|cuatrocient|quinient|seiscient|setecient|ochocient|novecient|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieci|veint|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)';
  const MONEY_OBJ = '(?:(?:de |del |el |la |los |las |en |un |una |otros? |mas |ya )*(?:' + NUMW + '|plata|dinero|efectivo|bs|bolivianos|pesos|bob|cash|\\$|\\d))';
  const ATM_HARD = /\b(cajero|atm)\b/;
  const ATM_VERB_RE = new RegExp('\\b(?:saque|sacamos|sacado|sacar|saco|retire|retiramos|retirado|retirar|retiro) ' + MONEY_OBJ);
  const ATM_BANK_RE = /\b(?:saque|sacamos|retire|retiramos)\b.*\bdel banco\b/;
  const OTHER_OBJ_RE = new RegExp('\\b(?:recibi|recibimos|me dieron|nos dieron|me dio|nos dio|me pasaron|nos pasaron|me prestaron|nos prestaron|ingrese|ingresamos) ' + MONEY_OBJ);
  const OTHER_MORE_RE = new RegExp('\\b(?:(?:le|les|me|nos) (?:regalo|regalaron|dieron|dio|mando|mandaron|enviaron|envio)|(?:me|nos) (?:llego|llegaron|reembolsaron)|ingresos? de|gane|ganamos|premio de|encontre|encontramos) ' + MONEY_OBJ);
  const OTHER_PERF_RE = /\b(?:me|nos) (?:ha|han) (?:devuelto|pagado|regalado|dado|transferido|prestado)\b|\b(?:me|nos) (?:pago|devolvio|pagaron)\b(?! (?:sol|pol|paul|yo))/;
  const OTHER_ANY_RE = /\b(cobre|cobramos|me pagaron|nos pagaron|me devolvieron|nos devolvieron|me devolvio|nos devolvio|me regalaron|nos regalaron|devolucion|reembolso|reembolsaron|vendi|vendimos|casa de cambio)\b/;
  const EXCHANGE_RE = /\b(cambie|cambiamos|cambiado|cambiados|cambiadas|cambiar|cambio|cambiaron|vendi|vendimos|casa de cambio)\b/;
  const FOREIGN_RE = /\b(dolares|dolar|usd|euros|euro|eur|verdes)\b|[$€]/;
  const NOT_CASHIN_RE = /\b(pague|pagamos|gaste|gastamos|compre|compramos|comision|propina|(?:me|nos|le|les) cobr(?:o|aron))\b/;
  // "cambié 700 bolivianos a dólares": salen bolivianos -> gasto
  const BUY_FOREIGN_RE = /\b(?:bs|bolivianos|pesos)\b.*\b(?:a|por|en)\s+(?:dolares|euros)\b|\bcompr\w* (?:\d\S* )?(?:dolares|euros)\b/;

  function detectType(norm) {
    const foreign = FOREIGN_RE.test(norm);
    if ((EXCHANGE_RE.test(norm) && (foreign || /casa de cambio/.test(norm))) || /\b(?:me|nos) dieron\b.*\bpor\b.*\b(?:dolares|euros|usd)\b/.test(norm)) {
      if (BUY_FOREIGN_RE.test(norm)) return { type: 'expense', source: null };
      return { type: 'cash_in', source: 'exchange' };
    }
    if (NOT_CASHIN_RE.test(norm)) return { type: 'expense', source: null };
    if (ATM_HARD.test(norm) || ATM_VERB_RE.test(norm) || ATM_BANK_RE.test(norm)) return { type: 'cash_in', source: 'atm' };
    if (OTHER_OBJ_RE.test(norm) || OTHER_ANY_RE.test(norm) || OTHER_MORE_RE.test(norm) || OTHER_PERF_RE.test(norm)) return { type: 'cash_in', source: 'other' };

  }

  const METHOD_RE = /\b(?:(?:con|por|en|via|mediante|pague con|pagamos con) )?(qr|q r|cu ?erre|codigo qr|tarjeta|transferencia|tigo money|(?:con|por|en) (?:debito|credito))\b/;

  // ---------- descripción ----------
  const FILLER = [
    /\b(?:me |nos |te )?(?:acabo|acabamos|acabas|acaba) de (?:gastar|pagar|comprar|sacar|retirar|cambiar|recibir|cobrar)\b/g,
    /\b(?:he|hemos|ha|has|han) (?:gastado|pagado|comprado|sacado|retirado|cambiado|recibido|cobrado)\b/g,
    /\b(?:me|nos|le|les) (?:costo|costaron|cobraron|cobro|salio|salieron|dieron|dio)\b/g,
    /\b(?:y )?(?:el |un )?gasto (?:es|fue|ha sido|seria|sería)\b/g,
    /\b(?:anota|anotar|apunta|apuntar|registra|registrar|anade|agrega|pon)(?:me)?\b/g,
    /\b(?:gaste|gastamos|gastaste|pague|pagamos|pagaste|compre|compramos|saque|sacamos|retire|retiramos|cambie|cambiamos|recibi|recibimos|cobre|cobramos|son|fueron|costo|cuesta|total|en total|vale|valio)\b/g,
    /\b(?:centavos)\b/g,
    /\b(?:a )?cada (?:uno|una)\b/g,
    /\b(?:en efectivo|efectivo|en cash|cash)\b/g
  ];
  const WHO_PHRASE = /\b(?:y )?(?:el gasto )?(?:es |fue |va )?(?:para|de|a|por) (?:mi mismo|mi misma|mi|ti|vos|noah|noa|noe|sol|pol|paul|pool|los dos|nosotros dos|nosotros|ambos|la pareja|toda la familia|la familia|familia|todos|los tres|el nene|el bebe|el peque|nuestro hijo|mi hijo)(?: y (?:para )?(?:mi|ti|noah|noa|sol|pol|paul|el nene|el bebe))*\b/g;
  const LEAD = new Set('en de del por un una unos unas el la los las a al y e que para lo le mi me nos te se con o es ha di dimos'.split(' '));
  const TRAIL = new Set('y e de en por para el la los las con que a al del o un una'.split(' '));

  function describe(orig, norm, toks, dropSpans) {
    const mask = new Array(orig.length).fill(false);
    const markSpan = (a, b) => { for (let i = a; i < b && i < mask.length; i++) mask[i] = true; };
    dropSpans.forEach(([a, b]) => markSpan(a, b));
    const res = [...FILLER, WHO_PHRASE, new RegExp(METHOD_RE.source, 'g'), new RegExp(DATE_RE.source, 'g'),
      /\b(?:del|en el|de un|en un|el|un) cajero(?: automatico)?\b/g, /\bcajero\b/g];
    for (const re of res) {
      let m; re.lastIndex = 0;
      while ((m = re.exec(norm))) { markSpan(m.index, m.index + m[0].length); if (!m[0].length) re.lastIndex++; }
    }
    let s = '';
    for (let i = 0; i < orig.length; i++) s += mask[i] ? ' ' : orig[i];
    s = s.replace(/[¿¡!?;:"“”«»]/g, ' ').replace(/\s*[,.]\s*/g, ' ').replace(/\s+/g, ' ').trim();
    let words = s.split(' ').filter(Boolean);
    const n = w => strip(w);
    while (words.length && LEAD.has(n(words[0]))) words.shift();
    while (words.length && TRAIL.has(n(words[words.length - 1]))) words.pop();
    s = words.join(' ');
    if (s.length > 48) s = s.slice(0, 48).replace(/\s+\S*$/, '') + '…';
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }

  // ---------- separar en cláusulas ----------
  const SPLIT_WORDS = new Set(['y', 'e', 'tambien', 'ademas', 'luego', 'despues']);

  function round2(v) { return Math.round(v * 100) / 100; }

  function parseUtterance(text, ctx) {
    ctx = ctx || {};
    const now = ctx.now || new Date();
    const me = ctx.me || null;
    const rates = Object.assign({ USD: 6.96, EUR: 7.5 }, ctx.rates || {});
    const extra = ctx.extraCats || [];
    // límite de longitud: un dictado real nunca pasa de unas frases; evita bloqueos con textos enormes
    const orig = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 600);
    if (!orig) return { items: [], text: '' };
    const norm = strip(orig);
    const toks = tokenize(norm);

    // tokens dentro de expresiones de fecha no son importes
    const dropMask = new Array(toks.length).fill(false);
    const dateRe = new RegExp(DATE_RE.source, 'g');
    let m;
    while ((m = dateRe.exec(norm))) {
      toks.forEach((t, i) => { if (t.start >= m.index && t.end <= m.index + m[0].length) dropMask[i] = true; });
    }
    const NT = '(\\d{1,2}(?:[:.]\\d{2})?|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)';
    const NOT_AMOUNT = [
      /\b\d+(?:[.,]\d+)? ?(?:km|kms|kilometros?|metros?|mts?|gramos|grs?|ml|cc|libras?|arrobas?)\b/g,
      /\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g,
      new RegExp('\\b(?:a|de|desde|hasta|para) las? ' + NT + '(?: y (?:media|cuarto|\\d+))?\\b', 'g'),
      new RegExp('\\b' + NT + ' (?:de la (?:manana|tarde|noche)|en punto|horas?|hrs?|minutos?|mins?)\\b', 'g'),
      /\b(?:calle|avenida|av|numero|nro|habitacion|talla|piso|linea|mesa para) \d+\b/g,
      // "km 3" (sin número delante ni moneda detrás: "300 km 250 bolivianos" conserva el 250)
      /(?:^|[^\d\s] ?|[a-z] )\b(?:km|kilometro) \d+\b(?! ?(?:bs|bolivianos|pesos))/g,
      new RegExp('\\bde ' + NT + ' a ' + NT + '(?=\\s+(?:\\d|horas|hrs))', 'g'),
      new RegExp('\\b\\d{1,2} de (?:' + MONTHS.join('|') + ')\\b', 'g')
    ];
    // calle/avenida con nombre: "calle Bolívar 25" -> ese número no es (casi seguro) un importe
    const demote = new Array(toks.length).fill(false);
    { const re = /\b(?:calle|avenida|av|barrio)\s+(?:[a-z]+\s+){1,3}?(?:n(?:umero|ro)?\s+)?(\d+)\b/g; let mm;
      while ((mm = re.exec(norm))) { const b = mm.index + mm[0].length; toks.forEach((t, i) => { if (t.kind === 'num' && t.end === b) demote[i] = true; }); } }
    // "puesto 12" (del mercado) no es importe, pero "he puesto 50 de gasolina" sí
    { const re = /\bpuesto (\d+)\b/g; let mm;
      while ((mm = re.exec(norm))) {
        if (/\b(?:he|has|ha|hemos|han|habeis) $/.test(norm.slice(Math.max(0, mm.index - 8), mm.index))) continue;
        const a = mm.index, b = a + mm[0].length;
        toks.forEach((t, i) => { if (t.kind === 'num' && t.start >= a && t.end <= b) dropMask[i] = true; });
      } }
    // horas, calles, km, fechas: sus números no son importes
    for (const re of NOT_AMOUNT) {
      let mm; re.lastIndex = 0;
      while ((mm = re.exec(norm))) {
        const a = mm.index, b = a + mm[0].length;
        toks.forEach((t, i) => { if (t.kind === 'num' || t.kind === 'word') { if (t.start >= a && t.end <= b && (t.kind === 'num' || t.t in UNITS)) dropMask[i] = true; } });
      }
    }
    let amounts = findAmounts(toks, dropMask);
    amounts.forEach(a => { if (demote[a.numIdx] && !a.currency) a.score -= 3; });
    // (d) correcciones habladas: "25, no, 35" / "40, digo 45" -> vale el último
    const CORR_KEY = new Set(['no', 'perdon', 'digo', 'dicho', 'decir', 'sea', 'corrijo', 'error', 'rectifico', 'realidad', 'espera']);
    const CORR_STRONG = new Set(['perdon', 'digo', 'dicho', 'corrijo', 'rectifico', 'realidad', 'espera', 'error']);
    const CORR_ALL = new Set([...CORR_KEY, 'mejor', 'quiero', 'o', 'es', 'son', 'era', 'eran', 'fue', 'fueron', 'mas', 'bien', 'perdona', 'uy', 'ay', 'eh', 'este', 'que', 'en', 'bueno', 'pues', 'ah', 'el', 'la']);
    const corrSpans = [];
    amounts = amounts.filter((a, k) => {
      const b = amounts[k + 1]; if (!b) return true;
      const between = toks.slice(a.i1 + 1, b.i0);
      if (!between.length) return true;
      const drop = () => { corrSpans.push([toks[a.i0].start, toks[b.i0 - 1].end]); return false; };
      // "25, no, 35" / "40, digo 45"
      if (between.every(t => t.kind === 'punct' || CORR_ALL.has(t.t)) && between.some(t => CORR_KEY.has(t.t))) return drop();
      // "no eran 50, eran 60 del mercado"
      const pre = toks.slice(Math.max(0, a.i0 - 2), a.i0).map(t => t.t);
      if (pre.indexOf('no') >= 0 && pre.some(w => /^(era|eran|fue|fueron|es|son)$/.test(w)) &&
          between.every(t => t.kind === 'punct' || CORR_ALL.has(t.t))) return drop();
      // "30 en el taxi, bueno, en realidad fueron 35" / "leche 10, no, leche 12": la corrección repite el mismo concepto
      const words = between.filter(t => t.kind === 'word');
      const firstWords = words.filter(t => !/^(bueno|pues|eh|ah|uy|ay|este)$/.test(t.t)).slice(0, 2).map(t => t.t);
      const strong = words.some(t => CORR_STRONG.has(t.t)) || firstWords[0] === 'no';
      if (strong) {
        const prevEnd = k > 0 ? amounts[k - 1].i1 + 1 : 0;
        const prefix = toks.slice(prevEnd, a.i0);
        const txt = ts => ts.filter(t => t.kind === 'word').map(t => t.t).join(' ');
        const other = words.filter(t => !CORR_ALL.has(t.t));
        const catB = other.length ? categorize(txt(other), extra) : null;
        const catAll = categorize(txt(prefix.concat(between)), extra);

      }
      return true;
    });

    const globalType = detectType(norm);
    const globalDate = detectDate(norm, now);
    // "$" suelto: en Bolivia el dólar se escribe "$us"; el dictado puede convertir "pesos" en "$".
    // Fuera de un cambio de divisa se trata como bolivianos (la hoja de revisión lo muestra).
    amounts.forEach(a => {
      if (a.symIdx < 0) return;
      const nx = toks[a.symIdx + 1];
      a.currency = (nx && (nx.t === 'us' || nx.t === 'usd')) || globalType.source === 'exchange' ? 'USD' : 'BOB';
    });

    // cláusulas
    let clauses = [];
    const noSplit = false;
    const isExch = globalType.source === 'exchange';
    const EXP_VERB = /^(gaste|gastamos|pague|pagamos|compre|compramos)$/;
    const ATM_VERB_ONLY = /^(saque|sacamos|retire|retiramos|cajero)$/;
    let cur = { a: 0, b: 0 };
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      let isSep = (t.kind === 'punct' && /[,;.!?]/.test(t.t)) || (t.kind === 'word' && SPLIT_WORDS.has(t.t));
      if (isSep && isExch) {
        // en un cambio solo se corta ante otra operación: un gasto, un cajero u otro cambio
        const seg = toks.slice(cur.a, i).map(x => x.t);
        const hadExch = seg.some(w => /^(cambie|cambiamos|cambiaron|cambiado|cambiar)$/.test(w));
        isSep = [1, 2, 3].some(d => toks[i + d] && (EXP_VERB.test(toks[i + d].t) || ATM_VERB_ONLY.test(toks[i + d].t) ||
          (!hadExch && /^(cambie|cambiamos)$/.test(toks[i + d].t))));
      }
      // no cortar dentro de un importe
      const inAmount = amounts.some(a => i > a.i0 && i <= a.i1);
      if (isSep && !inAmount) { cur.b = i; clauses.push(cur); cur = { a: i + 1, b: i + 1 }; }
    }
    cur.b = toks.length; clauses.push(cur);
    clauses = clauses.filter(c => c.b > c.a);

    const qualified = a => a.score >= 1;
    const anyQualified = amounts.some(qualified);
    const anyNonNeg = amounts.some(a => a.score >= 0);
    const amountsIn = c => amounts.filter(a => a.i0 >= c.a && a.i1 < c.b &&
      (anyQualified ? qualified(a) : anyNonNeg ? a.score >= 0 : (!a.qty && amounts.filter(x => !x.qty).length === 1)));

    // fusiona cláusulas sin importe con la anterior (o la siguiente)
    const merged = [];
    let pending = null;
    for (const c of clauses) {
      const has = amountsIn(c).length > 0;
      if (has) {
        const nc = { a: pending ? pending.a : c.a, b: c.b };
        pending = null; merged.push(nc);
      } else if (merged.length) {
        merged[merged.length - 1].b = c.b;
      } else {
        pending = pending ? { a: pending.a, b: c.b } : { a: c.a, b: c.b };
      }
    }
    if (!merged.length) merged.push({ a: 0, b: toks.length });
    else if (pending) merged[merged.length - 1].b = pending.b;
    // "gasolina para 120 km, 100 bolivianos": una cláusula que solo trae un número (sin concepto)
    // completa la anterior en vez de crear un movimiento fantasma
    for (let k = merged.length - 1; k > 0; k--) {
      const c = merged[k];
      const words = toks.slice(c.a, c.b).filter(t => t.kind === 'word' && isContent(t.t) && !/^(qr|bs|pesos|bolivianos|centavos|efectivo|cash|tarjeta|eh|bueno|pues|vale)$/.test(t.t));
      const ownSignal = toks.slice(c.a, c.b).some(t => t.kind === 'word' && (VERBS.has(t.t) || /^(cambie|cambiamos|saque|sacamos|retire|retiramos)$/.test(t.t)));
      const cs = toks[c.a] ? toks[c.a].start : 0, ce = toks[c.b - 1] ? toks[c.b - 1].end : 0;
      if (!words.length && !ownSignal && !detectWho(norm.slice(cs, ce), me)) { merged[k - 1].b = c.b; merged.splice(k, 1); }
    }

    if (!isExch) {
      const out = [];
      for (const c of merged) {
        const q = amountsIn(c).sort((x, y) => x.i0 - y.i0);
        const conceptFirst = q.length && toks.slice(c.a, q[0].i0).some(t => t.kind === 'word');
        let start = c.a;
        for (let k = 0; k + 1 < q.length; k++) {
          const x = q[k], y = q[k + 1];
          const bt = toks.slice(x.i1 + 1, y.i0);
          if (!bt.length) continue;
          const btNorm = norm.slice(bt[0].start, bt[bt.length - 1].end);
          if (!categorize(btNorm, extra)) continue;
          const cut = conceptFirst ? x.i1 + 1 : y.i0;
          if (cut > start) { out.push({ a: start, b: cut }); start = cut; }
        }
        out.push({ a: start, b: c.b });
      }
      merged.length = 0; out.forEach(c => merged.push(c));
    }
    const spanOf = c => {
      const s = toks[c.a] ? toks[c.a].start : 0;
      const e = toks[c.b - 1] ? toks[c.b - 1].end : norm.length;
      return [s, e];
    };

    const whoMentions = merged.map(c => { const [s, e] = spanOf(c); return detectWho(norm.slice(s, e), me); });
    const looseWho = clauses.filter(c => !amountsIn(c).length).map(c => { const [s, e] = spanOf(c); return detectWho(norm.slice(s, e), me); });
    const distinctWho = new Set(looseWho.filter(Boolean));

    // fechas: si se nombra una sola, vale para todo; si hay varias, cada cláusula la suya (o la anterior)
    const clauseDates = merged.map(c => { const [s, e] = spanOf(c); return detectDate(norm.slice(s, e), now); });
    const distinctDates = new Set(clauseDates.filter(Boolean).map(ymd));
    let carryDate = null;
    const opensWithDate = merged.map(c => { const [s0] = spanOf(c); const m = new RegExp('^\\s*' + DATE_RE.source).exec(norm.slice(s0)); return !!m; });
    const endsWithDate = new RegExp('(?:' + DATE_RE.source + ')\\W*$').test(norm);
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    let prevCategory = null;
    // "con QR: luz 130 y agua 60": el método dicho antes del primer importe vale para todos
    const firstAmt = amounts.length ? toks[amounts[0].i0].start : norm.length;
    const qrM = new RegExp(METHOD_RE.source).exec(norm);
    const qrUpfront = !!(qrM && qrM.index < firstAmt && merged.length > 1);
    const items = merged.slice(0, 20).map((c, ci) => {
      const [s, e] = spanOf(c);
      const cNorm = norm.slice(s, e);
      const cOrig = orig.slice(s, e);
      const cAm0 = amountsIn(c);
      const own = detectType(cNorm);
      const tinfo = !isExch || own.type === 'cash_in' || NOT_CASHIN_RE.test(cNorm) ? own : globalType;
      const cAm = tinfo.source === 'exchange' ? amounts.filter(a => a.i0 >= c.a && a.i1 < c.b) : cAm0;
      let pick = null;
      let amountBs = null, currency = 'BOB', amount = null, estimated = false, rateUsed = null;

      if (tinfo.source === 'exchange') {
        const foreign = cAm.filter(a => a.currency === 'USD' || a.currency === 'EUR');
        const bob = cAm.filter(a => a.currency === 'BOB');
        const plain = cAm.filter(a => !a.currency);

  function srcOf(id) { return SOURCES.find(s => s.id === id) || SOURCES[2]; }

  let txCache = { v: -1, list: [] };
  function allTxns() {
    if (txCache.v !== S.txv) txCache = { v: S.txv, list: validTxns(S.txns) };
    return txCache.list;
  }
  function validTxns(map) {
    const out = [];
    map.forEach((d, id) => {
      if (!d || typeof d !== 'object' || typeof d.amount !== 'number' || !isFinite(d.amount) || Math.abs(d.amount) > 1e9) return;
      if (typeof d.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.date) || ymd(parseYmd(d.date)) !== d.date) return;
      if (d.type !== 'expense' && d.type !== 'cash_in' && d.type !== 'adjust') return;
      const t = Object.assign({ id }, d);
      if (t.type !== 'adjust') t.amount = Math.abs(t.amount);
      if (typeof t.note !== 'string') t.note = '';
      out.push(t);
    });
    return out
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0)));
  }
  // ¿Los movimientos que vemos están confirmados por el servidor? (sin ellos no se puede cuadrar el efectivo)
  function dataReady() { return S.mode === 'local' || (S.mode === 'shared' && S.confirmed && !S.stale); }
  function balance(list) {
    let b = 0;
    for (const t of list) {
      if (t.type === 'cash_in') b += t.amount;
      else if (t.type === 'adjust') b += t.amount;
      else if (t.type === 'expense' && t.method !== 'qr') b -= t.amount;
    }
    return r2(b);
  }

  // ---------------------------------------------------------------- almacenamiento
  const LOCAL_KEY = 'qullqi.data.v1';
  const Store = {
    db: null,
    configQueue: Promise.resolve(),
    initLocal(reason) {
      S.mode = 'local'; S.localReason = reason || 'standalone'; S.canWrite = true;
      S.storageOk = ls.set('qullqi.probe', '1');
      this.loadLocal();
      S.configExists = true; S.configLoaded = true; S.loaded = true;
      window.addEventListener('storage', e => { if (e.key === LOCAL_KEY) { this.loadLocal(); renderAll(); } });
      renderAll();
    },
    loadLocal() {
      let data = null;
      try { data = JSON.parse(ls.get(LOCAL_KEY) || 'null'); } catch (e) { data = null; }
      data = data && typeof data === 'object' ? data : {};
      S.txns = new Map(Object.entries(data.txns && typeof data.txns === 'object' ? data.txns : {})); S.txv++;
      S.config = data.config && typeof data.config === 'object' ? data.config : {};
    },
    saveLocal() {
      const obj = { txns: Object.fromEntries(S.txns), config: S.config };
      const ok = ls.set(LOCAL_KEY, JSON.stringify(obj));
      if (!ok) { S.storageOk = false; renderBanners(); }
      return ok;
    },
    initShared(db) {
      this.db = db; S.mode = 'shared';
      const timer = setTimeout(() => { if (!S.confirmed) { S.stale = true; renderBanners(); } }, 10000);
      const subTxns = () => db.collection('txns').onSnapshot(snap => {
        const m = new Map();
        snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
        S.txns = m; S.loaded = true; S.txv++;
        S.confirmed = !snap.metadata.fromCache;
        if (S.confirmed) { S.stale = false; clearTimeout(timer); }
        renderAll();
      }, err => {
        S.loaded = true; S.stale = true; S.confirmed = false; clearTimeout(timer); renderAll();
        const code = err && err.code;
        if (code === 'unavailable') setTimeout(subTxns, 5000);
        else if (code === 'resource_exhausted' && (S.txnRetries = (S.txnRetries || 0) + 1) <= 3) setTimeout(subTxns, 30000 * S.txnRetries);
      });
      const subConfig = () => db.doc('config/main').onSnapshot(d => {
        S.config = d.exists ? (d.data() || {}) : {};
        S.configExists = !!d.exists;
        if (!d.metadata || !d.metadata.fromCache) S.configLoaded = true;
        if (S.uid && S.config.members && typeof S.config.members[S.uid] === 'string' && PEOPLE.indexOf(S.config.members[S.uid]) >= 0) {
          S.me = S.config.members[S.uid]; ls.set(meKey(), S.me);
        }
        renderAll();
      }, err => {
        const code = err && err.code;
        if (code === 'unavailable') setTimeout(subConfig, 5000);
        else if (code === 'resource_exhausted' && (S.cfgRetries = (S.cfgRetries || 0) + 1) <= 3) setTimeout(subConfig, 30000 * S.cfgRetries);
      });
      subTxns(); subConfig();
      renderAll();
    },
    async put(id, doc) {
      if (S.mode === 'local') {
        const had = S.txns.has(id), prev = S.txns.get(id);
        S.txns.set(id, doc); S.txv++;
        if (!this.saveLocal()) { if (had) S.txns.set(id, prev); else S.txns.delete(id); S.txv++; throw { code: 'local_storage' }; }
        renderAll(); return;
      }
      return this.retry(() => this.db.collection('txns').doc(id).set(doc));
    },
    async del(id) {
      if (S.mode === 'local') {
        const prev = S.txns.get(id);
        S.txns.delete(id); S.txv++;
        if (!this.saveLocal()) { if (prev) S.txns.set(id, prev); S.txv++; throw { code: 'local_storage' }; }
        renderAll(); return;
      }
      return this.retry(() => this.db.collection('txns').doc(id).delete());
    },
    patchConfig(patch) {
      if (S.mode === 'local') {
        const prev = S.config;
        S.config = deepMerge(JSON.parse(JSON.stringify(S.config || {})), patch);
        if (!this.saveLocal()) { S.config = prev; return Promise.reject({ code: 'local_storage' }); }
        renderAll(); return Promise.resolve();
      }
      // Nunca se reescribe la configuración entera: update() fusiona; set() solo si el documento no existe.
      const run = async () => {
        const ref = this.db.doc('config/main');
        try { await withTimeout(ref.update(patch)); }
        catch (e) {
          if (!e || e.code !== 'invalid_argument') {
            if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600)); return this.retry(() => ref.update(patch)); }
            throw writeError(e);
          }
          const snap = await withTimeout(ref.get());
          if (snap.exists) await this.retry(() => ref.update(patch));
          else {
            await this.retry(() => ref.set(patch));
            // si otro móvil creó el documento a la vez, su set() pudo pisar el nuestro: se vuelve a aplicar
            await new Promise(r => setTimeout(r, 500));
            const after = await withTimeout(ref.get());
            if (!after.exists || !containsPatch(after.data(), patch)) await this.retry(() => ref.update(patch));
          }
        }
        S.configExists = true;
      };
      const next = this.configQueue.then(run, run);
      this.configQueue = next.catch(() => {});
      return next;
    },
    async retry(fn) {
      try { return await withTimeout(fn()); }
      catch (e) {
        if (e && e.code === 'unavailable') {
          await new Promise(r => setTimeout(r, 400 + Math.random() * 800));
          try { return await withTimeout(fn()); } catch (e2) { throw writeError(e2); }
        }
        throw writeError(e);
      }
    }
  };
  function writeError(e) {
    const code = e && e.code;
    if (code === 'invalid_argument' || code === 'not_granted') { S.canWrite = false; renderBanners(); }
    return e || { code: 'unavailable' };
  }
  function errMsg(e, retryLabel) {
    const c = e && e.code;
    if (c === 'invalid_argument' || c === 'not_granted') return 'No tienes permiso para guardar. Pide acceso de Editor.';
    if (c === 'quota_exceeded') return 'El almacenamiento está lleno. Borra movimientos antiguos.';
    if (c === 'revoked') return 'Se ha retirado el acceso a los datos.';
    if (c === 'local_storage') return 'Este navegador no deja guardar datos. No se ha guardado nada.';
    if (c === 'timeout') return 'Sin conexión: no se pudo confirmar. ' + (retryLabel || 'Vuelve a tocar Guardar') + ' cuando tengas señal.';
    return 'No se pudo guardar. Revisa la conexión e inténtalo de nuevo.';
  }
  function containsPatch(obj, patch) {
    if (!obj || typeof obj !== 'object') return false;
    return Object.keys(patch).every(k => {
      const v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) return containsPatch(obj[k], v);
      return JSON.stringify(obj[k]) === JSON.stringify(v);
    });
  }
  function deepMerge(a, b) {
    for (const k of Object.keys(b)) {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = deepMerge(a[k] && typeof a[k] === 'object' ? a[k] : {}, b[k]);
      else a[k] = b[k];
    }
    return a;
  }

  // ---------------------------------------------------------------- render: comunes
  function tileHTML(t, small) {
    let color, icon;
    if (t.type === 'cash_in') { const s = srcOf(t.source); color = s.color; icon = s.icon; }
    else if (t.type === 'adjust') { color = '#6b6b73'; icon = 'adjust'; }
    else { const c = catById(t.category); color = c.color; icon = c.icon; }
    return '<span class="tile' + (small ? ' sm' : '') + '" style="background:' + esc(color) + '">' + svg(icon) + '</span>';
  }
  function rowHTML(t, withDay) {
    let title, sub = [], amt, cls = '';
    if (t.type === 'cash_in') {
      const s = srcOf(t.source);
      title = t.note || s.name;
      sub.push(title === (s.short || s.name) || title === s.name ? 'Entrada de efectivo' : (s.short || s.name));
      if (t.currency && t.currency !== 'BOB' && t.origAmount) sub.push(num(t.origAmount) + ' ' + t.currency);
      amt = '+' + money(t.amount); cls = 'in';
    } else if (t.type === 'adjust') {
      title = t.note || 'Ajuste de efectivo';
      sub.push('Ajuste');
      amt = (t.amount < 0 ? '−' : '+') + money(t.amount); cls = 'adj';
    } else {
      const c = catById(t.category);
      title = t.note || c.name;
      sub.push(catShort(c));
      if (whoName(t.who) !== catShort(c)) sub.push(whoName(t.who));
      if (t.method === 'qr') sub.push('QR / tarjeta');
      amt = money(t.amount);
    }
    if (withDay) sub.unshift(dayLabel(t.date));
    return '<li><button class="row" type="button" data-edit="' + esc(t.id) + '">' + tileHTML(t) +
      '<span class="txt"><span class="t1 t-note"></span><span class="t2">' + esc(sub.join(' · ')) + '</span></span>' +
      '<span class="amt ' + cls + '">' + esc(amt) + '</span></button></li>';
  }
  // Texto escrito por personas se inserta con textContent
  function fillNotes(container, list) {
    const byId = new Map(list.map(t => [t.id, t]));
    $$('[data-edit]', container).forEach(b => {
      const t = byId.get(b.getAttribute('data-edit'));
      const el = $('.t-note', b);
      if (!t || !el) return;
      let title;
      if (t.type === 'cash_in') title = t.note || srcOf(t.source).name;
      else if (t.type === 'adjust') title = t.note || 'Ajuste de efectivo';
      else title = t.note || catById(t.category).name;
      el.textContent = title;
    });
  }

  function renderAll() {
    renderBanners();
    renderHome();
    if (S.tab === 'hist') renderHist();
    if (S.tab === 'sum') renderSum();
    if (S.sheet && S.sheet.kind === 'settings') {
      const a = document.activeElement;
      if (!(a && $('#sheet-body').contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderSheet();
    }
  }

  function renderBanners() {
    const el = $('#banners');
    const parts = [];
    if (S.mode === 'local' && !S.storageOk) {
      parts.push('<div class="banner">' + svg('info') + '<span><strong>No se puede guardar.</strong> Este navegador bloquea el almacenamiento: lo que anotes se perderá al cerrar.</span></div>');
    } else if (S.mode === 'local') {
      parts.push('<div class="banner">' + svg('info') + '<span><strong>Solo en este dispositivo.</strong> ' +
        (S.localReason === 'nodb' ? 'Inicia sesión en Claude para compartir los datos con tu familia.' : 'Los datos se guardan en este navegador.') + '</span></div>');
    }
    if (S.mode === 'shared' && !S.canWrite) {
      parts.push('<div class="banner">' + svg('info') + '<span><strong>Solo lectura.</strong> Pide a quien creó Qullqi que te invite como Editor para poder anotar gastos.</span></div>');
    }
    if (S.mode === 'shared' && S.stale) {
      parts.push('<div class="banner">' + svg('info') + '<span><strong>Sin conexión con los datos.</strong> ' +
        (S.txns.size ? 'Lo que ves puede no estar al día.' : 'Revisa la conexión; se cargarán solos en cuanto vuelva.') + '</span></div>');
    }
    el.innerHTML = parts.join('');
  }

  // ---------------------------------------------------------------- render: inicio
  function renderHome() {
    $('#today-label').textContent = cap(DF_LONG.format(new Date()));
    if (!S.loaded || (S.mode === 'shared' && !S.confirmed && !S.txns.size)) {
      $('#cash-total').innerHTML = '<span class="cur">Bs</span>—';
      $('#recent').innerHTML = '<li class="loading">Cargando…</li>';
      return;
    }
    const list = allTxns();
    const bal = balance(list);
    const ct = $('#cash-total');
    ct.innerHTML = moneyHTML(bal);
    ct.classList.toggle('neg', bal < 0);
    const startBox = $('#start-box');
    const showStart = !list.length && S.canWrite && dataReady() && ls.get('qullqi.started') !== '1';
    if (showStart && !startBox.firstChild) {
      startBox.innerHTML = '<p class="start-q"><label for="start-in">¿Cuánto efectivo tenéis ahora?</label></p><form class="start" id="start-form" autocomplete="off">' +
        '<div class="amt-box"><span>Bs</span><input id="start-in" type="text" inputmode="decimal" placeholder="0"/></div>' +
        '<button class="btn-primary" type="button" id="start-go">Empezar</button></form>' +
        '<p class="start-help">Cuenta los billetes para partir de la cantidad real, o <button type="button" class="inline-link" id="start-zero">empieza desde 0</button>.</p>';
    } else if (!showStart && startBox.firstChild) startBox.innerHTML = '';
    $('#cash-stats').hidden = showStart;
    const t = todayStr(), m = monthOf(t);
    let sToday = 0, sMonth = 0;
    list.forEach(x => { if (x.type === 'expense') { if (x.date === t) sToday += x.amount; if (monthOf(x.date) === m) sMonth += x.amount; } });
    $('#spent-today').textContent = money(sToday);
    $('#month-label').textContent = 'Gastado en ' + DF_MONTH_ONLY.format(new Date());
    $('#spent-month').textContent = money(sMonth);

    // quién soy
    const who = $('#whoami');
    if (!S.me && (S.mode === 'local' || S.configLoaded)) {
      who.innerHTML = '<div class="whoami"><p>¿Quién usa este móvil?<span>Así entiendo «para mí» cuando dictes.</span></p><div class="pills">' +
        PEOPLE.map(p => '<button type="button" class="pill-btn" data-me="' + p + '">' + p + '</button>').join('') + '</div></div>';
    } else who.innerHTML = '';

    const rec = list.slice(0, 5);
    const ul = $('#recent');
    if (!rec.length) {
      ul.innerHTML = '<li class="empty"><strong>Aún no hay movimientos</strong>' + (S.dict ? 'Toca el micrófono y di, por ejemplo, «saqué 1000 del cajero» o «35 en taxi».' : 'Escribe o dicta con el teclado, por ejemplo, «saqué 1000 del cajero» o «35 en taxi».') + '</li>';
      $('#see-all').hidden = true;
    } else {
      ul.innerHTML = rec.map(x => rowHTML(x, true)).join('');
      fillNotes(ul, rec);
      $('#see-all').hidden = false;
    }
    if (bal < 0) {
      const b = $('#banners');
      if (!$('#neg-hint')) b.insertAdjacentHTML('beforeend', '<div class="banner" id="neg-hint">' + svg('info') + '<span>El efectivo sale negativo: quizá falta anotar un retiro del cajero. <button type="button" class="inline-link" id="fix-cash">Corregir el efectivo</button></span></div>');
    }
    renderMic();
  }

  function renderMic() {
    const mic = $('#mic'), label = $('#mic-label'), sub = $('#mic-sub'), ex = $('#examples');
    const st = S.dictState;
    const on = st === 'listening' || st === 'starting';
    mic.classList.toggle('on', on);
    mic.classList.toggle('busy', st === 'finishing');
    mic.innerHTML = svg(on ? 'stop' : 'mic');
    if (S.dict) {
      mic.setAttribute('aria-label', on ? 'Terminar dictado' : 'Dictar un gasto');
      if (st === 'starting') { label.textContent = 'Preparando…'; sub.textContent = 'Toca para cancelar'; }
      else if (st === 'listening') { label.textContent = 'Te escucho…'; sub.textContent = 'Toca el botón cuando termines'; }
      else if (st === 'finishing') { label.textContent = 'Un momento…'; sub.textContent = ''; }
      else { label.textContent = 'Toca y di tu gasto'; sub.textContent = 'Por ejemplo: «25 bolivianos en un café para Noah»'; }
      ex.innerHTML = 'También: <q>saqué 1000 del cajero</q> · <q>40 de taxi y 120 en el súper</q>';
    } else {
      mic.setAttribute('aria-label', 'Dictar con el teclado');
      label.textContent = 'Toca y dicta';
      sub.textContent = 'Usa el micrófono de tu teclado y luego envía.';
      ex.innerHTML = 'Prueba: <q>25 en un café para Noah</q> · <q>saqué 1000 del cajero</q> · <q>cambié 100 dólares por 950</q>';
    }
  }

  // ---------------------------------------------------------------- render: movimientos
  function renderHist() {
    const box = $('#hist-list');
    $$('#hist-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === S.hist.f)));
    const chip = $('#hist-chip');
    if (S.hist.cat || S.hist.who) {
      const label = S.hist.cat ? catById(S.hist.cat).name : 'Para ' + whoName(S.hist.who);
      chip.innerHTML = '<button type="button" class="chip-filter" id="clear-cat"><span class="cf-name"></span>' + svg('x') + '<span class="sr">Quitar filtro</span></button>';
      $('.cf-name', chip).textContent = label + (S.hist.month ? ' · ' + DF_MONTH.format(parseYmd(S.hist.month + '-01')) : '');
    } else chip.innerHTML = '';
    if (!S.loaded) { box.innerHTML = '<p class="loading">Cargando…</p>'; return; }
    const q = P.strip(S.hist.q.trim());
    let list = allTxns().filter(t => {
      if (S.hist.f === 'expense' && t.type !== 'expense') return false;
      if (S.hist.f === 'cash' && t.type === 'expense') return false;
      if (S.hist.cat && (t.type !== 'expense' || catById(t.category).id !== S.hist.cat)) return false;
      if (S.hist.who && (t.type !== 'expense' || (WHO.some(w => w.id === t.who) ? t.who : 'familia') !== S.hist.who)) return false;
      if (S.hist.month && monthOf(t.date) !== S.hist.month) return false;
      if (q) {
        const hay = P.strip([t.note, t.text, t.type === 'expense' ? catById(t.category).name : srcOf(t.source).name, t.type === 'expense' ? whoName(t.who) : ''].join(' '));
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    if (!list.length) {
      box.innerHTML = '<div class="group" style="margin-top:14px"><div class="empty"><strong>' + (S.txns.size ? 'Nada por aquí' : 'Aún no hay movimientos') + '</strong>' +
        (S.txns.size ? 'Prueba con otro filtro o búsqueda.' : 'Lo que anotes aparecerá aquí, agrupado por día.') + '</div></div>';
      return;
    }
    const total = list.length;
    const shown = list.slice(0, S.hist.limit);
    const groups = [];
    shown.forEach(t => { const g = groups[groups.length - 1]; if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] }); });
    const dayTotals = {};
    list.forEach(t => { if (t.type === 'expense') dayTotals[t.date] = (dayTotals[t.date] || 0) + t.amount; });
    box.innerHTML = groups.map(g => '<div class="day-h"><span>' + esc(cap(dayLabel(g.date))) + '</span><span>' + (dayTotals[g.date] ? esc(money(dayTotals[g.date])) : '') + '</span></div>' +
      '<div class="group"><ul class="list">' + g.items.map(t => rowHTML(t, false)).join('') + '</ul></div>').join('') +
      (total > shown.length ? '<button type="button" class="more" id="more">Mostrar más (' + (total - shown.length) + ')</button>' : '');
    fillNotes(box, shown);
  }

  // ---------------------------------------------------------------- render: resumen
  function renderSum() {
    const cur = monthOf(todayStr());
    if (S.month > cur) S.month = cur;
    let first = cur;
    S.txns.forEach(d => { if (d && typeof d.date === 'string' && /^\d{4}-\d{2}/.test(d.date) && d.date.slice(0, 7) < first) first = d.date.slice(0, 7); });
    if (S.month < first) S.month = first;
    $('#m-label').textContent = cap(DF_MONTH.format(parseYmd(S.month + '-01')));
    $('#m-next').disabled = S.month >= cur;
    $('#m-prev').disabled = S.month <= first;
    const body = $('#sum-body');
    if (!S.loaded) { body.innerHTML = '<p class="loading">Cargando…</p>'; return; }
    const all = allTxns();
    const mlist = all.filter(t => monthOf(t.date) === S.month);
    const exp = mlist.filter(t => t.type === 'expense');
    const total = r2(exp.reduce((s, t) => s + t.amount, 0));
    const [yy, mm] = S.month.split('-').map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const isCur = S.month === cur;
    const daysElapsed = isCur ? new Date().getDate() : daysInMonth;
    const prevM = ymd(new Date(yy, mm - 2, 1)).slice(0, 7);
    const prevTotal = all.filter(t => t.type === 'expense' && monthOf(t.date) === prevM).reduce((s, t) => s + t.amount, 0);
    const monthName = DF_MONTH_ONLY.format(new Date(yy, mm - 1, 1));
    const prevName = DF_MONTH_ONLY.format(new Date(yy, mm - 2, 1));

    let h = '<div class="hero"><p class="label">Gastado en ' + esc(monthName) + '</p><p class="big">' + moneyHTML(total) + '</p>' +
      '<p class="sub">' + (exp.length ? 'Media diaria ' + esc(money(Math.round(total / daysElapsed))) + ' · ' + exp.length + (exp.length === 1 ? ' gasto' : ' gastos') : 'Sin gastos este mes') +
      (prevTotal ? '<br>' + esc(cap(prevName)) + ': ' + esc(money(prevTotal)) : '') + '</p></div>';

    if (!exp.length) {
      const ins = mlist.filter(t => t.type === 'cash_in');
      h += '<div class="group" style="margin-top:16px"><div class="empty"><strong>Nada que resumir todavía</strong>' +
        (ins.length ? 'Este mes solo hay entradas de efectivo.' : all.length ? 'No hay gastos anotados en ' + esc(monthName) + '.' : 'Cuando anotes gastos verás aquí en qué se va el dinero.') + '</div></div>';
      body.innerHTML = h; return;
    }

    // por categoría
    const byCat = {};
    exp.forEach(t => { const id = catById(t.category).id; byCat[id] = (byCat[id] || 0) + t.amount; });
    const catRows = Object.keys(byCat).map(id => ({ c: catById(id), v: r2(byCat[id]) })).sort((a, b) => b.v - a.v);
    const maxC = catRows[0].v;
    h += '<section class="sec"><div class="sec-h"><h2>Por categoría</h2><span class="meta">Toca para ver</span></div><div class="group"><ul class="list bars">' +

        '<div class="track"><i style="width:' + (r.v / maxC * 100).toFixed(1) + '%"></i></div></button></li>').join('') + '</ul></div></section>';

    // para quién
    const byWho = {};
    exp.forEach(t => { const w = WHO.find(x => x.id === t.who) ? t.who : 'familia'; byWho[w] = (byWho[w] || 0) + t.amount; });
    const whoRows = WHO.filter(w => byWho[w.id]).map(w => ({ w, v: r2(byWho[w.id]) })).sort((a, b) => b.v - a.v);
    const maxW = whoRows[0].v;
    h += '<section class="sec"><div class="sec-h"><h2>Para quién</h2><span class="meta">Toca para ver</span></div><div class="group"><ul class="list bars">' +
      whoRows.map(r => '<li><button type="button" class="bar-row" data-who="' + r.w.id + '" aria-label="' + esc(r.w.name + ': ' + money(r.v)) + '"><div class="bar-top"><span class="tile sm" style="background:var(--fill-strong);color:var(--label)">' + svg(r.w.id === 'noah' ? 'noah' : 'personal') + '</span>' +
        '<span class="name">' + esc(r.w.name) + '</span><span class="val">' + esc(money(r.v)) + '</span><span class="pct">' + pct(r.v, total) + '</span></div>' +
        '<div class="track"><i style="width:' + (r.v / maxW * 100).toFixed(1) + '%"></i></div></button></li>').join('') + '</ul></div></section>';

    // día a día

    h += '<section class="sec"><div class="sec-h"><h2>Día a día</h2><span class="meta">Máx. ' + esc(money(Math.max.apply(null, perDay))) + '</span></div><div class="chart-card" id="daychart">' +
      dayChart(perDay, isCur ? new Date().getDate() : 0, yy, mm) + '</div></section>';

    // pago y efectivo

    h += '<section class="sec"><div class="sec-h"><h2>Cómo pagamos</h2></div><div class="group kv">' +
      '<div>Efectivo</div><div>' + esc(money(cash)) + '</div><div>QR / tarjeta</div><div>' + esc(money(qr)) + '</div></div></section>';

      SOURCES.map(s => '<div>' + esc(s.name) + '</div><div' + (inBy(s.id) ? '' : ' class="muted"') + '>' + esc(money(inBy(s.id))) + '</div>').join('') + '</div></section>';
    body.innerHTML = h;

  }

  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * p;
  }
  function dayChart(perDay, today, yy, mm) {
    const W = 340, H = 150, L = 38, R = 6, T = 10, B = 22;
    const n = perDay.length, max = niceMax(Math.max.apply(null, perDay));
    const pw = W - L - R, ph = H - T - B, band = pw / n, bw = Math.max(3, band * 0.64);
    const y = v => T + ph - (v / max) * ph;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Gasto por día del mes. Recorre las barras con el tabulador.">';
    [0, max / 2, max].forEach((g, i) => {
      s += '<line class="' + (i ? 'grid' : 'base') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '"/>';
      s += '<text class="axis" x="' + (L - 6) + '" y="' + (y(g) + 3.5) + '" text-anchor="end">' + esc(num(g)) + '</text>';
    });
    perDay.forEach((v, i) => {
      const x = L + i * band + (band - bw) / 2;
      if (v > 0) {
        const top = y(v), r = Math.min(2, bw / 2, (T + ph - top));
        const base = T + ph;
        s += '<path class="col' + (today && i + 1 > today ? ' dim' : '') + '" data-c="' + (i + 1) + '" d="M' + x + ',' + base + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top +
          'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + base + 'Z"/>';
      }
      s += '<rect class="hit" data-d="' + (i + 1) + '" data-v="' + v + '" x="' + (L + i * band) + '" y="' + T + '" width="' + band + '" height="' + ph + '"' +
        (v > 0 ? ' tabindex="0" role="img" aria-label="' + esc(DF_SHORT.format(new Date(yy, mm - 1, i + 1)) + ': ' + money(v)) + '"' : '') + '/>';
    });
    [1, 8, 15, 22, n].forEach(d => {
      s += '<text class="axis" x="' + (L + (d - 0.5) * band) + '" y="' + (H - 6) + '" text-anchor="middle">' + d + '</text>';
    });
    return s + '</svg><div class="tip" id="tip" hidden></div>';
  }
  function wireChart() {
    const card = $('#daychart'); if (!card) return;
    const tip = $('#tip', card), svgEl = $('svg', card);
    const [yy, mm] = S.month.split('-').map(Number);
    const show = e => {
      const r = e.target.closest && e.target.closest('.hit'); if (!r) return;
      const d = +r.dataset.d, v = +r.dataset.v;
      $$('.col.sel', svgEl).forEach(c => c.classList.remove('sel'));
      const col = $('.col[data-c="' + d + '"]', svgEl); if (col) col.classList.add('sel');
      const box = svgEl.getBoundingClientRect(), cb = card.getBoundingClientRect();
      const scale = box.width / 340;
      const x = (parseFloat(r.getAttribute('x')) + parseFloat(r.getAttribute('width')) / 2) * scale + (box.left - cb.left);
      tip.textContent = DF_SHORT.format(new Date(yy, mm - 1, d)) + ' · ' + money(v);
      tip.hidden = false;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const cx = Math.min(Math.max(x, tw / 2 + 6), cb.width - tw / 2 - 6);
      tip.style.left = cx + 'px'; tip.style.top = Math.max(th + 6, box.top - cb.top + 10) + 'px';
    };
    svgEl.addEventListener('pointermove', show);
    svgEl.addEventListener('pointerdown', show);
    svgEl.addEventListener('focusin', show);
    svgEl.addEventListener('focusout', () => { tip.hidden = true; });
    svgEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { tip.hidden = true; $$('.col.sel', svgEl).forEach(c => c.classList.remove('sel')); } });
  }

  // ---------------------------------------------------------------- toast
  let toastTimer = null;
  function toast(msg, actLabel, act) {
    if (S.sheet) actLabel = null; // con una hoja abierta, sin acciones que se puedan tocar por error
    const el = $('#toast'), b = $('#toast-act');
    $('#toast-msg').textContent = msg;
    if (actLabel) { b.textContent = actLabel; b.hidden = false; b.onclick = () => { hideToast(); act(); }; }
    else { b.hidden = true; b.onclick = null; }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, actLabel ? 7000 : 3200);
  }
  function hideToast(silent) {
    if (!silent && $('#toast').contains(document.activeElement)) restoreFocus(null);
    clearTimeout(toastTimer); $('#toast').classList.remove('show'); $('#toast-act').hidden = true; $('#toast-act').onclick = null; }

  // ---------------------------------------------------------------- hoja
  let lastFocus = null;
  function openSheet(state) {
    const wasOpen = !!S.sheet;

    S.sheet = state;
    if (!wasOpen) lastFocus = document.activeElement;
    hideToast(true);
    // 2) cada hoja nueva empieza arriba (se ve lo que se ha oído)
    const resetScroll = !wasOpen || prevKind !== state.kind;
    renderSheet();
    const sh = $('#sheet'), sc = $('#scrim');
    if (!wasOpen) {
      sh.hidden = false; sc.hidden = false;
      void sh.offsetWidth;
      $('#sheet-body').scrollTop = 0;
      sh.classList.add('show'); sc.classList.add('show');
      document.body.classList.add('sheet-open');
      $$('#app, .tabbar').forEach(e => { e.setAttribute('aria-hidden', 'true'); e.inert = true; });
      setTimeout(() => {

    }

  // Devuelve el foco a algo visible de la pantalla actual
  function restoreFocus(el) {
    const visible = x => x && document.contains(x) && x !== document.body && x.getClientRects().length > 0 && !x.closest('[hidden]') && !x.disabled;
    let target = visible(el) ? el : null;
    if (!target) target = S.tab === 'home' ? $('#mic') : $('#scr-' + S.tab + ' h1');
    try { target.focus({ preventScroll: true }); } catch (e) { /* */ }
  }

    restoreFocus(lastFocus);

  function focusKey(el, root) {

  // ---- hoja: movimiento(s)

      currency: it.currency || 'BOB', origAmount: it.amount, rateUsed: it.rateUsed, estimated: !!(it.flags && it.flags.estimated),

  function draftLine(d) {

      const inp = $('#say'); inp.value = t; updateSend(); setTab('home');
      setTimeout(() => { inp.focus(); inp.setSelectionRange(t.length, t.length); }, 320);
      return;
    }
    if (act === 'toggle') { const d = st.items[+b.dataset.i]; d.open = !d.open; renderSheet(); const m = $('.mini[data-i="' + b.dataset.i + '"]'); if (m) m.focus({ preventScroll: true }); return; }
    if (act === 'remove') {
      const i = +b.dataset.i;
      st.items.splice(i, 1);
      if (!st.items.length) { closeSheet(); return; }
      if (st.items.length === 1) st.items[0].open = true;
      renderSheet();
      const next = $('.mini[data-i="' + Math.min(i, st.items.length - 1) + '"]') || $('#amt-0') || $('#sheet-ok');
      if (next) next.focus({ preventScroll: true });
      return;
    }
    if (act === 'delete') {
      if (!S.canWrite) return;
      if (!st.armed) { st.armed = true; renderSheet(); setTimeout(() => { if (S.sheet === st && st.armed) { st.armed = false; renderSheet(); } }, 4000); return; }
      const id = st.editId, prev = S.txns.get(id);
      closeSheet();
      if (!prev) { toast('Este movimiento ya no existe.'); return; }
      Store.del(id).then(() => {
        toast('Movimiento eliminado', 'Deshacer', () => Store.put(id, prev).then(() => toast('Movimiento restaurado')).catch(e2 => toast(errMsg(e2))));
        setTimeout(() => { const b2 = $('#toast-act'); if (!b2.hidden) b2.focus({ preventScroll: true }); }, 320);
      })
        .catch(err => toast(errMsg(err)));
      return;
    }
    const k = b.dataset.k; if (!k) return;
    const d = st.items[+b.dataset.i];
    d[k] = b.dataset.v;
    if (k === 'category') d.guessed = false;
    if (k === 'type' && d.type === 'cash_in' && !d.source) d.source = 'atm';
    renderSheet();
  }
  function onEntryInput(e) {

    const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
